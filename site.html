<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Formation frontend</h1>
    <form>
        <label for="name">Name:</label>
        <input type="text" id="name" name="name">
        <br><br>
        <label for ="email">Email:</label>
        <input type="email" id="email" name="email">
        <br><br>
        <label for =password>Password:</label>
        <input type="password" id="password" name="password">
        <br><br>    
        <label for="gender">Gender:</label>
        <br>
        <label for="male">Male</label>
        <input type="radio" id="male" name="gender" value="male">
        <label for="female">Female</label>
        <input type="radio" id="female" name="gender" value="female">
        <br><br>
        <label for="date">Date of Birth:</label>
        <input type="date" id="date" name="date">
        <br><br>  
        <label for="Specialty">specialty:</label>  
        <input type="checkbox" id="Specialty" name="Specialty" value="frontend">
        <label for="Specialty">Frontend</label>
        <input type="checkbox" id="Specialty" name="Specialty" value="backend">
        <label for="Specialty">backend</label>
        <br><br>
        <label for="file">Upload File:</label>
        <br>
        <input type="file" id="file" name="file">
        <br><br>
        <label for="color">color:</label>
        <input type="color" id="color" name="color">    
        <br><br>
        <label for="range">Range:</label>
        <input type="range" id="range" name="range" min="0"     max="100">
        <br><br>
        <label for="tel">Phone Number:</label>
        <input type="tel" id="tel" name="tel">
        <br><br>
        <label for="Message">Message:</label>
        <textarea></textarea>
        <br><br> 
        <input type="submit" value="Submit">
    </form>
    <img src="image.jpg" alt="Image">
    <br><br>
    <audio controls>
        <source src="audio.mp3" type="audio/mpeg">
    </audio>
    <br><br>
    <video controls>
        <source src="video.mp4" type="video/mp4">
    </video>
</body>
</html>
